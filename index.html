<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario Magisterio</title>
<meta name="theme-color" content="#7c4fd6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>📚 Calendario Magisterio</h1>
    <div class="subtitle">1º Curso</div>
  </header>

  <div class="conn-error" id="connError"></div>

  <div class="next-card empty" id="nextCard"></div>

  <nav class="tabs">
    <button class="active" data-target="horario">Horario</button>
    <button data-target="cuatrimestre">Cuatrimestre</button>
    <button data-target="examenes">Exámenes</button>
    <button data-target="trabajos">Trabajos</button>
    <button data-target="notas">Notas</button>
  </nav>

  <main>
    <section class="view active" id="view-horario"></section>
    <section class="view" id="view-cuatrimestre"></section>
    <section class="view" id="view-examenes"></section>
    <section class="view" id="view-trabajos"></section>
    <section class="view" id="view-notas"></section>
  </main>

  <nav class="bottom">
    <div class="inner">
      <button class="active" data-target="horario"><span class="icon">🗓️</span>Horario</button>
      <button data-target="cuatrimestre"><span class="icon">📆</span>Cuatri</button>
      <button data-target="examenes"><span class="icon">📝</span>Exámenes</button>
      <button data-target="trabajos"><span class="icon">📌</span>Trabajos</button>
      <button data-target="notas"><span class="icon">🎓</span>Notas</button>
    </div>
  </nav>

  <div class="modal-overlay" id="dayChoiceOverlay">
    <div class="modal day-choice">
      <h3 id="dayChoiceTitle">Añadir el día</h3>
      <div class="day-choice-btns">
        <button type="button" class="day-choice-btn" id="dayChoiceExamen"><span class="dc-icon">📝</span>Examen</button>
        <button type="button" class="day-choice-btn" id="dayChoiceTrabajo"><span class="dc-icon">📌</span>Trabajo</button>
      </div>
      <button type="button" class="modal-btn ghost" id="dayChoiceCancel">Cancelar</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Añadir</h3>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn danger" id="modalDelete">Eliminar</button>
        <div class="modal-actions-right">
          <button type="button" class="modal-btn ghost" id="modalCancel">Cancelar</button>
          <button type="button" class="modal-btn primary" id="modalSave">Guardar</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="app.js?v=7"></script>
</body>
</html>
