<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario Magisterio</title>
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>📚 Calendario Magisterio</h1>
    <div class="subtitle">1º Curso</div>
  </header>

  <div class="next-card empty" id="nextCard"></div>

  <nav class="tabs">
    <button class="active" data-target="horario">Horario</button>
    <button data-target="examenes">Exámenes</button>
    <button data-target="trabajos">Trabajos</button>
    <button data-target="notas">Notas</button>
  </nav>

  <main>
    <section class="view active" id="view-horario"></section>
    <section class="view" id="view-examenes"></section>
    <section class="view" id="view-trabajos"></section>
    <section class="view" id="view-notas"></section>
  </main>

  <nav class="bottom">
    <div class="inner">
      <button class="active" data-target="horario"><span class="icon">🗓️</span>Horario</button>
      <button data-target="examenes"><span class="icon">📝</span>Exámenes</button>
      <button data-target="trabajos"><span class="icon">📌</span>Trabajos</button>
      <button data-target="notas"><span class="icon">🎓</span>Notas</button>
    </div>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
